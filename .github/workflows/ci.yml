name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "pipelines/requirements.txt\nbackend/requirements-dev.txt\nmodel/requirements.txt" }
      - run: pip install -r pipelines/requirements.txt -r model/requirements.txt -r backend/requirements-dev.txt
      - run: PYTHONPATH=pipelines python -m pytest pipelines/tests -q
      - run: python -m pytest model/tests -q
      - run: cd backend && python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci && npm run typecheck && npm test && npx vite build
