# Render Blueprint: the FastAPI backend as a free native-Python web service (no Docker).
# Deploy: Render dashboard > New > Blueprint > pick this repo. Frontend goes to Vercel (see README).
services:
  - type: web
    name: ecometrix-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: ALLOWED_ORIGINS
        sync: false        # set to your Vercel URL(s), comma separated, e.g. https://ecometrix.vercel.app
