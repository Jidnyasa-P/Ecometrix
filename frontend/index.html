<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>EcoMetrix: where Pune's next tree should go</title>
    <meta name="description" content="EcoMetrix turns open satellite, census and map data into a clear baseline of trees, heat and green-space access for Pune." />
    <meta name="theme-color" content="#07201A" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

      try { var t = localStorage.getItem("ecometrix-theme"); document.documentElement.dataset.theme = t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); } catch (e) { document.documentElement.dataset.theme = "light"; }
    </script>
  </head>

    <div id="root"></div>
