    label: ASSUMED
    source: 'Policy setting: dense plantation is not counted as publicly accessible
      park unless verified as open.'
  carbon_enabled: false
  carbon:
    estimated: false
    source: No city-specific planting survival and sequestration series has been validated
      for this city.
pocket_park:
  counts_for_access:
    value: true
    label: ASSUMED
    source: A pocket park only counts if it meets the city access-area threshold.
  min_area_ha_for_access:
    value: 0.0
    label: ASSUMED
    source: https://www.tpl.org/parkserve/about
