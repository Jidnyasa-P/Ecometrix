    source: 'US OMB Circular A-94 Appendix C, 2026 rates: real Treasury rates are
      1.4% at 7 years, 1.6% at 10 years and 2.0% at 20/30 years. https://www.whitehouse.gov/wp-content/uploads/2026/03/M-26-09-2026-Discount-Rates-for-OMB-Circular-No.-A-94.pdf'
    note: Federal cost-effectiveness comparator, not a New York City-specific social
      discount policy; maturity interpolation is approximated by the displayed range.
  horizon_years:
    value: 10
    label: ASSUMED
    source: Project configuration; editable after local appraisal review.
